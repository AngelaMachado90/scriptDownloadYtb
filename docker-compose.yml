services:
  musica-library:
    build: .
    container_name: musica-library
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8507:8501"
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - /home/server/.config/scriptDownloadYtb:/run/secrets:ro
    environment:
      YTDLP_COOKIES_FILE: /run/secrets/youtube-cookies.txt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
